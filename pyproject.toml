[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mycode"
version = "0.1.0"
description = "全屏终端 AI 对话助手"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4,<5",
  "textual>=8.2,<9",
  "anthropic>=0.125,<1",
  "openai>=2.54,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "rich>=14.3,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
MyCode = "mycode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mycode.tui" = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

